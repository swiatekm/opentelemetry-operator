name: "Publish images"

# Publishes the operator, target allocator, OpAMP bridge and must-gather images
# tagged `main`. Release images are published by release.yaml.
on:
  push:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    permissions:
      packages: write # required for pushing images to ghcr.io
      id-token: write # required for keyless signing
    name: Publish container images
    runs-on: ubuntu-latest
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "~1.26.8"
          cache: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log into Docker.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: ${{ env.DOCKER_USERNAME != '' }}
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GitHub Package Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install release tools
        run: make goreleaser cosign

      - name: Build, push and sign images
        env:
          MAIN_BUILD: "true"
        run: |
          export PATH="${PWD}/bin:${PATH}"
          BINARY_VERSION="$(git describe --tags --match 'v*' | sed 's/^v//')"
          export BINARY_VERSION
          goreleaser release --clean --skip=validate
