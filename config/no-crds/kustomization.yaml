# The default deployment without the CRDs, with the operator reading its
# configuration from a file. Used by the e2e-no-crds tests.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../default
- config.yaml
patches:
- path: manager_config_patch.yaml
- path: remove_crds_patch.yaml
  target:
    kind: CustomResourceDefinition
